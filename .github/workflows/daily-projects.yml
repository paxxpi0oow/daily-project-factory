name: Daily Project Generator

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate 5 projects
        run: python generate_projects.py

      - name: Commit & push
        run: |
          git config user.name "paxxpi0oow"
          git config user.email "faqihrizqinugraha8@gmail.com"
          git add .
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git commit -m "chore: add daily projects $(date +'%Y-%m-%d')"
          git push
